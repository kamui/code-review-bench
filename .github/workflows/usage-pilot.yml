name: Usage pilot

on:
  pull_request:
    paths:
      - 'rust/usage-pilot/**'
      - 'tools/usage_pilot/**'
      - 'tools/behavior_contract*'
      - 'tools/behavior_contracts/**'
      - 'bench/tools/*usage.py'
      - '.github/workflows/usage-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'rust/usage-pilot/**'
      - 'tools/usage_pilot/**'
      - 'tools/behavior_contract*'
      - 'tools/behavior_contracts/**'
      - 'bench/tools/*usage.py'
      - '.github/workflows/usage-pilot.yml'

permissions:
  contents: read

jobs:
  usage-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain and dependencies
        working-directory: rust/usage-pilot
        run: |
          rustup show
          cargo fetch --locked
      - name: Check development and release behavior
        run: python3 tools/usage_pilot/verify.py --output /tmp/usage-pilot-checks
      - name: Check the typed Python domain
        run: |
          python3 -m pip install -r tools/usage_pilot/requirements-checks.txt
          python3 -m mypy --strict --follow-imports=silent tools/usage_pilot/typed_usage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usage-pilot-checks
          path: /tmp/usage-pilot-checks
