name: CI and GitHub Pages

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Web and evidence
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore repository evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 bench/tools/evidence_store.py fetch --manifest bench/evidence/manifests/repository-payloads-2026-10-08-v1.json
      - name: Restore the transcript archives the export publishes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 bench/tools/evidence_store.py fetch --manifest bench/evidence/manifests/last-push-transcripts-2026-10-09-v1.json
          python3 bench/tools/evidence_store.py fetch --manifest bench/evidence/manifests/last-push-skill-transcripts-2026-10-11-v1.json
          python3 bench/tools/evidence_store.py fetch --manifest bench/evidence/manifests/last-push-review-code-transcripts-2026-10-12-v1.json
      - name: Fetch the freeze commits of runs that pin re-cut packets
        run: python3 tools/fetch_freeze_commits.py
      - name: Install rustup when the image has none
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install bench-tools, which writes the explorer export
        run: |
          (cd rust/bench-tools && rustup show && rustup default "$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')" && cargo fetch --locked)
          echo "BENCH_RUNTIME_STORE=$RUNNER_TEMP/rust-runtime-store" >> "$GITHUB_ENV"
          BENCH_RUNTIME_STORE="$RUNNER_TEMP/rust-runtime-store" python3 bench/tools/rust_runtime.py install --crate rust/bench-tools --select
      - name: Configure Pages
        if: github.event_name != 'pull_request' && vars.PAGES_PREVIEW_BRANCH == ''
        id: pages
        uses: actions/configure-pages@v5
      - run: bun install --frozen-lockfile
      - name: Verify preserved evidence
        run: |
          bun run verify:import
          bun run verify:current
          bun run verify:claims
      - name: Test scoring and exports
        run: bun run test:web
      - name: Build static site
        run: |
          bun run build
          test -f dist/client/index.html
        env:
          BASE_PATH: ${{ github.event_name == 'pull_request' && format('/{0}/', github.event.repository.name) || format('{0}/', steps.pages.outputs.base_path) }}
      - name: Check types after route generation
        run: bun run typecheck
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  grading:
    name: Grading regressions
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      BENCH_DISK_RESERVE_GIB: '0'
      CODEX_VERSION: '0.160.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select grading coverage from the complete PR diff
        id: selection
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 tools/select_grading_tests.py --event-name "$EVENT_NAME" --event-path "$GITHUB_EVENT_PATH" --output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        with:
          bun-version: '1.3.10'
      - uses: actions/setup-python@v5
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        with:
          python-version: '3.12'
      - name: Restore repository evidence
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 bench/tools/evidence_store.py fetch --manifest bench/evidence/manifests/repository-payloads-2026-10-08-v1.json
      - name: Fetch the freeze commits of runs that pin re-cut packets
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        run: python3 tools/fetch_freeze_commits.py
      - uses: actions/setup-go@v5
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        with:
          go-version: '1.26.5'
          cache: false
      - name: Install sandbox tools
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap ripgrep
      - name: Install pinned Codex client
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        run: bun install --global @openai/codex@"$CODEX_VERSION"
      - name: Verify Codex client version
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        run: test "$(codex --version)" = "codex-cli $CODEX_VERSION"
      - name: Test benchmark tools and provisioning
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        run: bun run test:bench

  client:
    name: Client compatibility
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      CLAUDE_VERSION: '2.1.287'
      DISABLE_AUTOUPDATER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore repository evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 bench/tools/evidence_store.py fetch --manifest bench/evidence/manifests/repository-payloads-2026-10-08-v1.json
      - name: Install sandbox tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap ripgrep
      - name: Install pinned Claude client
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s -- "$CLAUDE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify client version
        run: test "$(claude --version)" = "$CLAUDE_VERSION (Claude Code)"
      - name: Test client against the local fake API
        run: bun run test:client

  deploy:
    # PAGES_PREVIEW_BRANCH names a branch Pages serves in place of main's build; unset it to deploy from main again.
    if: github.event_name != 'pull_request' && vars.PAGES_PREVIEW_BRANCH == ''
    needs: [build, grading, client]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
