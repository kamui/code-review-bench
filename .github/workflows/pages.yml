name: CI and GitHub Pages

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # Line tables build the tests a fifth to a quarter faster than full debuginfo and still give a panic its file and line.
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  bench-tools:
    name: Build bench-tools
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # bench-tools refuses a host whose glibc is older than its build host's, and the grading and client jobs run 22.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      store: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      # runtime resolve refuses a selection built from any crate tree but HEAD's, so a store keyed by it is never stale.
      - name: Key the store by the runner image and the crate tree
        id: key
        run: echo "key=bench-tools-store-$ImageOS-$RUNNER_ARCH-$(git rev-parse HEAD:rust/bench-tools)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: store
        with:
          path: ${{ runner.temp }}/rust-runtime-store
          key: ${{ steps.key.outputs.key }}
      - name: Install rustup when the image has none
        if: steps.store.outputs.cache-hit != 'true'
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install pinned Rust toolchain
        if: steps.store.outputs.cache-hit != 'true'
        run: (cd rust/bench-tools && rustup show && rustup default "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)")
      - uses: Swatinem/rust-cache@v2
        if: steps.store.outputs.cache-hit != 'true'
        with:
          workspaces: rust/bench-tools
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install bench-tools for the jobs that restore evidence, export and grade
        if: steps.store.outputs.cache-hit != 'true'
        env:
          BENCH_RUNTIME_STORE: ${{ runner.temp }}/rust-runtime-store
        run: |
          (cd rust/bench-tools && cargo fetch --locked)
          bench/tools/bench-tools runtime install --select
      - uses: actions/cache/save@v4
        if: steps.store.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/rust-runtime-store
          key: ${{ steps.key.outputs.key }}
      - name: Require the saved store the other jobs restore
        if: steps.store.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/rust-runtime-store
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
          fail-on-cache-miss: true

  build:
    name: Web and evidence
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: bench-tools
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Select this job's coverage from the complete PR diff
        id: selection
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: bun tools/select_grading_tests.ts --event-name "$EVENT_NAME" --event-path "$GITHUB_EVENT_PATH" --job build --output "$GITHUB_OUTPUT"
      - name: Select the mapping replay's coverage from the complete PR diff
        id: mapping
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: bun tools/select_grading_tests.ts --event-name "$EVENT_NAME" --event-path "$GITHUB_EVENT_PATH" --job mapping-replay --output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install rustup when the image has none
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install pinned Rust toolchain
        run: |
          (cd rust/bench-tools && rustup show && rustup default "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)")
          echo "BENCH_RUNTIME_STORE=$RUNNER_TEMP/rust-runtime-store" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/bench-tools
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore bench-tools, which restores evidence and writes the explorer export
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/rust-runtime-store
          key: ${{ needs.bench-tools.outputs.store }}
          fail-on-cache-miss: true
      - name: Restore repository evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: bench/tools/bench-tools evidence fetch --manifest bench/evidence/manifests/repository-payloads-2026-10-08-v1.json
      - name: Restore the transcript and grading archives the export and replays read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bench/tools/bench-tools evidence fetch --manifest bench/evidence/manifests/last-push-transcripts-2026-10-09-v1.json
          bench/tools/bench-tools evidence fetch --manifest bench/evidence/manifests/last-push-skill-transcripts-2026-10-11-v1.json
          bench/tools/bench-tools evidence fetch --manifest bench/evidence/manifests/last-push-review-code-transcripts-2026-10-12-v1.json
          bench/tools/bench-tools evidence fetch --manifest bench/evidence/manifests/ce-luna-redo-transcripts-2026-10-22-v1.json
          bench/tools/bench-tools evidence fetch --manifest bench/evidence/manifests/rule-v3-regrade-2026-10-23-v1.json
          bench/tools/bench-tools evidence fetch --manifest bench/evidence/manifests/rule-v3-regrade-2026-10-23-rulings-v1.json
          bench/tools/bench-tools evidence fetch --manifest bench/evidence/manifests/rule-v3-regrade-2026-10-23-rulings-2-v1.json
          bench/tools/bench-tools evidence fetch --manifest bench/evidence/manifests/rule-v3-regrade-2026-10-23-audit-v2-v1.json
          bench/tools/bench-tools evidence fetch --manifest bench/evidence/manifests/rule-v4-regrade-2026-10-25-v1.json
      - name: Fetch the freeze commits of runs that pin re-cut packets
        run: bench/tools/bench-tools fetch-freeze-commits
      - name: Check the restored packages through bench-tools
        run: |
          bench/tools/bench-tools archive check-packages --cache .cache/evidence \
            bench/evidence/manifests/repository-payloads-2026-10-08-v1.json \
            bench/evidence/manifests/last-push-transcripts-2026-10-09-v1.json \
            bench/evidence/manifests/last-push-skill-transcripts-2026-10-11-v1.json \
            bench/evidence/manifests/last-push-review-code-transcripts-2026-10-12-v1.json \
            bench/evidence/manifests/ce-luna-redo-transcripts-2026-10-22-v1.json \
            bench/evidence/manifests/rule-v3-regrade-2026-10-23-v1.json \
            bench/evidence/manifests/rule-v3-regrade-2026-10-23-rulings-v1.json \
            bench/evidence/manifests/rule-v3-regrade-2026-10-23-rulings-2-v1.json \
            bench/evidence/manifests/rule-v3-regrade-2026-10-23-audit-v2-v1.json \
            bench/evidence/manifests/rule-v4-regrade-2026-10-25-v1.json
      - name: Check that the grading replay inventory is current
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        run: |
          (cd rust/bench-tools && cargo test --locked --test grading_replay -- --ignored --exact the_replay_inventory_accounts_for_every_receipt)
          git diff --exit-code -- docs/python-migration/grading-replay.v1.json
      - name: Replay the blinded validator on every restorable archive against its recorded outcome
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        working-directory: rust/bench-tools
        run: cargo test --locked --test grading_replay -- --ignored --exact the_validator_replays_every_restorable_archive_identically --nocapture
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - run: bun install --frozen-lockfile
      - name: Verify preserved evidence
        run: |
          bun run verify:import
          bun run verify:current
          bun run verify:claims
      - name: Test scoring and exports
        run: bun run test:web:site
      - name: Test repository tools
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        run: bun run test:web:tools
      - name: Check migrated callers when the repository tool tests are skipped
        if: steps.selection.outcome == 'success' && steps.selection.outputs.run == 'false'
        run: bun test ./tools/moved_cli_callers.test.ts
      - name: Build static site
        run: |
          bun run build
          test -f dist/client/index.html
        env:
          BASE_PATH: ${{ github.event_name == 'pull_request' && format('/{0}/', github.event.repository.name) || format('{0}/', steps.pages.outputs.base_path) }}
      - name: Check types after route generation
        run: bun run typecheck
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      # Last, so the web checks report first; it still runs when one fails, and reuses their grading_replay test build.
      - name: Replay the mapping of every restorable archive against its recorded outcome
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' && (steps.mapping.outcome != 'success' || steps.mapping.outputs.run != 'false') }}
        working-directory: rust/bench-tools
        run: cargo test --locked --test grading_replay -- --ignored --exact the_mapping_replays_every_restorable_archive_identically --nocapture

  grading-tests:
    name: Grading regression tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: bench-tools
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      BENCH_DISK_RESERVE_GIB: '0'
      CODEX_VERSION: '0.160.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Select this job's coverage from the complete PR diff
        id: selection
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: bun tools/select_grading_tests.ts --event-name "$EVENT_NAME" --event-path "$GITHUB_EVENT_PATH" --job grading-tests --output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        with:
          node-version: '24'
      - name: Install rustup when the image has none
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install pinned Rust toolchain
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        run: |
          (cd rust/bench-tools && rustup show && rustup default "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)")
          echo "BENCH_RUNTIME_STORE=$RUNNER_TEMP/rust-runtime-store" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        with:
          workspaces: rust/bench-tools
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore bench-tools, which restores evidence
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/rust-runtime-store
          key: ${{ needs.bench-tools.outputs.store }}
          fail-on-cache-miss: true
      - name: Restore repository evidence
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bench/tools/bench-tools evidence fetch --manifest bench/evidence/manifests/repository-payloads-2026-10-08-v1.json
      - name: Fetch the freeze commits of runs that pin re-cut packets
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        run: bench/tools/bench-tools fetch-freeze-commits
      - uses: actions/setup-go@v5
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        with:
          go-version: '1.26.5'
          cache: false
      - name: Install sandbox tools
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap ripgrep
      - name: Install pinned Codex client
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        run: bun install --global @openai/codex@"$CODEX_VERSION"
      - name: Verify Codex client version
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        run: test "$(codex --version)" = "codex-cli $CODEX_VERSION"
      - name: Test grading dispatch against the fake clients and the sandbox
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        working-directory: rust/bench-tools
        run: cargo test --locked --test grading_sandbox --test grade_dispatch -- --ignored
      - name: Test benchmark tools and provisioning
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        run: bun run test:bench

  grading:
    name: Grading regressions
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [grading-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require the grading regression tests to pass
        env:
          RESULT: ${{ needs.grading-tests.result }}
        run: test "$RESULT" = success

  client:
    name: Client compatibility
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: bench-tools
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      CLAUDE_VERSION: '2.1.287'
      DISABLE_AUTOUPDATER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Select this job's coverage from the complete PR diff
        id: selection
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: bun tools/select_grading_tests.ts --event-name "$EVENT_NAME" --event-path "$GITHUB_EVENT_PATH" --job client --output "$GITHUB_OUTPUT"
      - name: Restore bench-tools, which serves the blinded grading MCP
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/rust-runtime-store
          key: ${{ needs.bench-tools.outputs.store }}
          fail-on-cache-miss: true
      - name: Install sandbox tools
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap ripgrep
      - name: Install pinned Claude client
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s -- "$CLAUDE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify client version
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        run: test "$(claude --version)" = "$CLAUDE_VERSION (Claude Code)"
      - name: Test client against the local fake API
        if: steps.selection.outcome != 'success' || steps.selection.outputs.run != 'false'
        env:
          BENCH_RUNTIME_STORE: ${{ runner.temp }}/rust-runtime-store
        run: bench/tools/bench-tools grading probe-claude

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, grading, client]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
