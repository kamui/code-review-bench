name: Rust runtime

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Rust runtime changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the Rust runtime is affected
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          RANGE: ${{ github.event_name == 'pull_request' && '...' || '..' }}
          RUST_RUNTIME_PATHS: |-
            ^rust/
            ^bench/tools/(rust_runtime|test_rust_runtime|check_manifest|rates|evidence_store|evidence_inventory|regrade)\.py$
            ^bench/schema/
            ^bench/(roster|rates\.current|scoreboard\.current)\.json$
            ^bench/arms/
            ^bench/harness/
            ^tools/behavior_contracts/
            ^docs/python-migration/runtime-evidence/rollback\.sh$
            ^\.github/workflows/rust-runtime\.yml$
        run: |
          rust=true
          if git cat-file -e "$BASE^{commit}" 2> /dev/null; then
            changed=$(git diff --no-renames --name-only "$BASE$RANGE$HEAD")
            grep -qE -f <(printf '%s\n' "$RUST_RUNTIME_PATHS") <<< "$changed" || rust=false
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  rust-runtime:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        # One runner per entry of rust_runtime.SUPPORTED_TARGETS.
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
    name: rust-runtime (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rustup when the image has none
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install pinned Rust toolchain and dependencies
        working-directory: rust/bench-tools
        run: |
          rustup show
          rustup default "$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.target }}"
          cargo fetch --locked
      - name: Check bench-tools formatting, lints and tests
        if: github.event_name != 'pull_request' || runner.os == 'Linux'
        working-directory: rust/bench-tools
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Check pinning, retention and rollback
        working-directory: bench/tools
        env:
          RUST_RUNTIME_REQUIRE_CARGO: '1'
        run: python3 -m unittest test_rust_runtime -v
      - name: Install bench-tools and check the retained executable
        env:
          BENCH_RUNTIME_STORE: ${{ runner.temp }}/rust-runtime-store
        run: |
          python3 bench/tools/rust_runtime.py install --crate rust/bench-tools --select
          python3 bench/tools/rust_runtime.py resolve bench-tools
          python3 bench/tools/rust_runtime.py exec bench-tools -- roster > "$RUNNER_TEMP/roster.tsv"
          test -s "$RUNNER_TEMP/roster.tsv"
      - name: Smoke test the behavior contracts on macOS pull requests
        if: github.event_name == 'pull_request' && runner.os == 'macOS'
        working-directory: rust/bench-tools
        run: 'cargo test --locked --test behavior_contracts -- diff-identity::'
      - name: Install a second version and roll back
        if: github.event_name != 'pull_request' || runner.os == 'Linux'
        run: docs/python-migration/runtime-evidence/rollback.sh "$RUNNER_TEMP/rollback" "$(git rev-parse HEAD)"

  required:
    name: Rust runtime required
    needs: [changes, rust-runtime]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the Rust runtime jobs to pass or be skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          RUNTIME: ${{ needs.rust-runtime.result }}
        run: |
          test "$CHANGES" = success
          test "$RUNTIME" = success || test "$RUNTIME" = skipped
