name: Rust runtime

on:
  pull_request:
    paths:
      - 'rust/**'
      - 'bench/tools/rust_runtime.py'
      - 'bench/tools/test_rust_runtime.py'
      - 'bench/tools/diff_identity.py'
      - 'bench/tools/normalize_review.py'
      - 'bench/tools/check_manifest.py'
      - 'bench/tools/rates.py'
      - 'bench/tools/upstream.py'
      - 'bench/tools/claims.py'
      - 'bench/tools/evidence_store.py'
      - 'bench/tools/current_grading.py'
      - 'bench/tools/packet_selection.py'
      - 'bench/tools/regrade.py'
      - 'bench/tools/subscription_meters.py'
      - 'bench/schema/**'
      - 'bench/roster.json'
      - 'bench/rates.current.json'
      - 'bench/scoreboard.current.json'
      - 'bench/arms/**'
      - 'bench/harness/**'
      - 'tools/behavior_contract.py'
      - 'tools/behavior_contracts/**'
      - 'docs/python-migration/runtime-evidence/rollback.sh'
      - '.github/workflows/rust-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'bench/tools/rust_runtime.py'
      - 'bench/tools/test_rust_runtime.py'
      - 'bench/tools/diff_identity.py'
      - 'bench/tools/normalize_review.py'
      - 'bench/tools/check_manifest.py'
      - 'bench/tools/rates.py'
      - 'bench/tools/upstream.py'
      - 'bench/tools/claims.py'
      - 'bench/tools/evidence_store.py'
      - 'bench/tools/current_grading.py'
      - 'bench/tools/packet_selection.py'
      - 'bench/tools/regrade.py'
      - 'bench/tools/subscription_meters.py'
      - 'bench/schema/**'
      - 'bench/roster.json'
      - 'bench/rates.current.json'
      - 'bench/scoreboard.current.json'
      - 'bench/arms/**'
      - 'bench/harness/**'
      - 'tools/behavior_contract.py'
      - 'tools/behavior_contracts/**'
      - 'docs/python-migration/runtime-evidence/rollback.sh'
      - '.github/workflows/rust-runtime.yml'

permissions:
  contents: read

jobs:
  rust-runtime:
    strategy:
      fail-fast: false
      matrix:
        # One runner per entry of rust_runtime.SUPPORTED_TARGETS.
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
    name: rust-runtime (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rustup when the image has none
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install pinned Rust toolchain and dependencies
        working-directory: rust/usage-pilot
        run: |
          rustup show
          rustup default "$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.target }}"
          cargo fetch --locked
          (cd ../bench-tools && cargo fetch --locked)
      - name: Check bench-tools formatting, lints and tests
        working-directory: rust/bench-tools
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Check pinning, retention and rollback
        working-directory: bench/tools
        env:
          RUST_RUNTIME_REQUIRE_CARGO: '1'
        run: python3 -m unittest test_rust_runtime -v
      - name: Install the usage pilot and run the corpus with the retained executable
        run: |
          store="$RUNNER_TEMP/rust-runtime-store"
          python3 bench/tools/rust_runtime.py install --crate rust/usage-pilot --store "$store" --select | tee "$RUNNER_TEMP/install.json"
          sha=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["pin"]["sha256"])' "$RUNNER_TEMP/install.json")
          python3 bench/tools/rust_runtime.py verify usage-pilot "$sha" --store "$store"
          python3 - "$store/usage-pilot/$sha/usage-pilot" > "$RUNNER_TEMP/map.json" <<'EOF'
          import json, os, sys
          adapter = os.path.abspath("tools/usage_pilot/adapter.py")
          print(json.dumps({"codex": [sys.executable, adapter, "codex", "--engine", "rust", "--binary", sys.argv[1]],
                            "transcript": [sys.executable, adapter, "transcript"]}))
          EOF
          python3 tools/behavior_contract.py --implementations "$RUNNER_TEMP/map.json"
      - name: Install bench-tools and run its corpora with the retained executable
        env:
          BENCH_RUNTIME_STORE: ${{ runner.temp }}/rust-runtime-store
        run: |
          python3 bench/tools/rust_runtime.py install --crate rust/bench-tools --select
          python3 bench/tools/rust_runtime.py resolve bench-tools | tee "$RUNNER_TEMP/bench-tools.json"
          python3 tools/behavior_contract.py --verify-decision-history
          python3 tools/behavior_contract.py --corpus tools/behavior_contracts/roster.v1.json
          python3 bench/tools/rust_runtime.py exec bench-tools -- roster > "$RUNNER_TEMP/roster.tsv"
          test -s "$RUNNER_TEMP/roster.tsv"
          python3 - "$RUNNER_TEMP/bench-tools.json" > "$RUNNER_TEMP/bench-tools-map.json" <<'EOF'
          import json, sys
          executable = json.load(open(sys.argv[1]))["executable"]
          print(json.dumps({name: [executable, name] for name in ("diff-identity", "normalize-review", "check-manifest", "rates", "upstream")}))
          EOF
          for corpus in diff-identity normalize-review check-manifest rates upstream; do
            python3 tools/behavior_contract.py --corpus "tools/behavior_contracts/$corpus.v1.json" --implementations "$RUNNER_TEMP/bench-tools-map.json"
            python3 tools/behavior_contract.py --allow-known-defects --corpus "tools/behavior_contracts/$corpus.v1.json" --differential "$RUNNER_TEMP/bench-tools-map.json"
          done
          python3 tools/behavior_contract.py --corpus tools/behavior_contracts/normalize-thermo.v1.json
          python3 tools/behavior_contract.py --corpus tools/behavior_contracts/derive-packet.v1.json
          python3 tools/behavior_contract.py --corpus tools/behavior_contracts/build-packet.v1.json
          python3 tools/behavior_contract.py --corpus tools/behavior_contracts/export-explorer.v1.json
          python3 tools/behavior_contract.py --corpus tools/behavior_contracts/archive.v1.json
          python3 - "$RUNNER_TEMP/bench-tools.json" > "$RUNNER_TEMP/regrade-map.json" <<'EOF'
          import json, sys
          executable = json.load(open(sys.argv[1]))["executable"]
          print(json.dumps({"regrade-status": [executable, "regrade", "status", "--"],
                            "regrade-archive-attempt": [executable, "regrade", "archive-attempt"]}))
          EOF
          python3 tools/behavior_contract.py --corpus tools/behavior_contracts/regrade-reports.v1.json --implementations "$RUNNER_TEMP/regrade-map.json"
          python3 tools/behavior_contract.py --allow-known-defects --corpus tools/behavior_contracts/regrade-reports.v1.json --differential "$RUNNER_TEMP/regrade-map.json"
          python3 tools/behavior_contract.py --corpus tools/behavior_contracts/audit-log.v1.json
      - name: Run the evidence storage corpus with the retained executable and against the retained Python
        # Evidence storage refuses paths below a symlink, as Python does; macOS keeps its temporary directories below
        # the /var and /tmp links.
        if: runner.os == 'Linux'
        env:
          BENCH_RUNTIME_STORE: ${{ runner.temp }}/rust-runtime-store
        run: |
          python3 - "$RUNNER_TEMP/bench-tools.json" > "$RUNNER_TEMP/evidence-map.json" <<'EOF'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import behavior_contract
          executable = json.load(open(sys.argv[1]))["executable"]
          commands = behavior_contract.default_commands(
              behavior_contract.load_corpus(Path("tools/behavior_contracts/evidence-store.v1.json")))
          # pack and publish stay with evidence_store.py until #155's next slice ports them.
          python = commands["evidence-store"]
          commands["evidence-store"] = {"fetch": [executable, "evidence"], "verify": [executable, "evidence"],
                                        "pack": python, "publish": python}
          print(json.dumps(commands))
          EOF
          python3 tools/behavior_contract.py --corpus tools/behavior_contracts/evidence-store.v1.json --implementations "$RUNNER_TEMP/evidence-map.json"
          python3 tools/behavior_contract.py --allow-known-defects --corpus tools/behavior_contracts/evidence-store.v1.json --differential "$RUNNER_TEMP/evidence-map.json"
      - name: Install a second version and roll back
        run: docs/python-migration/runtime-evidence/rollback.sh "$RUNNER_TEMP/rollback" "$(git rev-parse HEAD)"
