name: Rust runtime

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Rust runtime changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the Rust runtime is affected
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          RANGE: ${{ github.event_name == 'pull_request' && '...' || '..' }}
          RUST_RUNTIME_PATHS: |-
            ^rust/
            ^bench/tools/(bench-tools|dispatch\.sh)$
            ^tools/(without-python|fake-client-cell)\.sh$
            ^bench/schema/
            ^bench/(roster|rates\.current|scoreboard\.current)\.json$
            ^bench/arms/
            ^bench/harness/
            ^tools/behavior_contracts/
            ^docs/python-migration/runtime-evidence/rollback\.sh$
            ^\.github/workflows/rust-runtime\.yml$
        run: |
          rust=true
          if git cat-file -e "$BASE^{commit}" 2> /dev/null; then
            changed=$(git diff --no-renames --name-only "$BASE$RANGE$HEAD")
            grep -qE -f <(printf '%s\n' "$RUST_RUNTIME_PATHS") <<< "$changed" || rust=false
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  rust-runtime:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        # A runner for every entry of grade::runtime::SUPPORTED_TARGETS. x86_64 Linux splits into
        # parallel parts to shorten the slowest job; the other targets keep one job.
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            part: contracts
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            part: tests
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            part: runtime
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            part: all
          - runner: macos-latest
            target: aarch64-apple-darwin
            part: all
    name: rust-runtime (${{ matrix.target }}, ${{ matrix.part }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install rustup when the image has none
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install pinned Rust toolchain and dependencies
        working-directory: rust/bench-tools
        run: |
          rustup show
          rustup default "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.target }}"
          cargo fetch --locked
      - name: Install bubblewrap for the provisioning sandbox
        if: runner.os == 'Linux' && (matrix.part == 'tests' || (matrix.part == 'all' && github.event_name != 'pull_request'))
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          # Ubuntu 24.04 lets AppArmor refuse the unprivileged user namespaces bwrap needs.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-pid --proc /proc -- true
      - name: Check bench-tools formatting, lints and tests
        if: matrix.part == 'all' && github.event_name != 'pull_request'
        working-directory: rust/bench-tools
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Check bench-tools formatting, lints and tests other than the behavior contracts
        if: matrix.part == 'tests'
        working-directory: rust/bench-tools
        # An explicit bash adds pipefail, so a failed `cargo metadata` fails the step.
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          # cargo cannot exclude one test target, so name every other target `cargo test` runs.
          selection=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '
            .packages[] | select(.name == "bench-tools") | .targets[]
            | select(.test and .name != "behavior_contracts")
            | if .kind[0] == "lib" then "--lib" else "--\(.kind[0])=\(.name)" end')
          mapfile -t targets <<< "$selection"
          cargo test --locked "${targets[@]}"
          # --doc cannot be combined with other target selections.
          cargo test --locked --doc
      - name: Run the behavior contracts with no Python on PATH
        if: matrix.part == 'contracts'
        working-directory: rust/bench-tools
        run: ../../tools/without-python.sh cargo test --locked --test behavior_contracts
      - name: Check pinning, retention and rollback
        if: matrix.part == 'runtime' || matrix.part == 'all'
        working-directory: rust/bench-tools
        run: cargo test --locked --test runtime
      - name: Install bench-tools and check the retained executable
        if: matrix.part == 'all'
        env:
          BENCH_RUNTIME_STORE: ${{ runner.temp }}/rust-runtime-store
        run: |
          bench/tools/bench-tools runtime install --select
          bench/tools/bench-tools runtime resolve
          bench/tools/bench-tools roster > "$RUNNER_TEMP/roster.tsv"
          test -s "$RUNNER_TEMP/roster.tsv"
      - uses: oven-sh/setup-bun@v2
        if: matrix.part == 'runtime'
        with:
          bun-version: '1.3.10'
      - name: Install the explorer's dependencies
        if: matrix.part == 'runtime'
        run: bun install --frozen-lockfile
      # The maintained engine needs no Python: install, a fake-client cell filed through a frozen run's pin, the
      # freeze-commit fetch, the explorer export and the scorecard all run with every Python interpreter removed from
      # PATH.
      - name: Install bench-tools and run the maintained workflows with no Python on PATH
        if: matrix.part == 'runtime'
        env:
          BENCH_RUNTIME_STORE: ${{ runner.temp }}/rust-runtime-store
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/without-python.sh sh -euc '
            bench/tools/bench-tools runtime install --select
            bench/tools/bench-tools runtime resolve
            bench/tools/bench-tools roster > "$RUNNER_TEMP/roster.tsv"
            test -s "$RUNNER_TEMP/roster.tsv"
            tools/fake-client-cell.sh "$RUNNER_TEMP/fake-client-cell"
            bench/tools/bench-tools fetch-freeze-commits
            bun run data
            bun run scorecard > "$RUNNER_TEMP/scorecard.txt"
            test -s "$RUNNER_TEMP/scorecard.txt"
          '
      - name: Smoke test the behavior contracts on pull requests
        if: matrix.part == 'all' && github.event_name == 'pull_request'
        working-directory: rust/bench-tools
        run: 'cargo test --locked --test behavior_contracts -- diff-identity::'
      - name: Install a second version and roll back
        if: matrix.part == 'runtime' || (matrix.part == 'all' && github.event_name != 'pull_request')
        run: docs/python-migration/runtime-evidence/rollback.sh "$RUNNER_TEMP/rollback" "$(git rev-parse HEAD)"

  required:
    name: Rust runtime required
    needs: [changes, rust-runtime]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the Rust runtime jobs to pass or be skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          RUNTIME: ${{ needs.rust-runtime.result }}
        run: |
          test "$CHANGES" = success
          test "$RUNTIME" = success || test "$RUNTIME" = skipped
