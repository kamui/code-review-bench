name: Rust runtime

on:
  pull_request:
    paths:
      - 'rust/**'
      - 'bench/tools/rust_runtime.py'
      - 'bench/tools/test_rust_runtime.py'
      - 'bench/tools/check_manifest.py'
      - 'bench/tools/rates.py'
      - 'bench/tools/evidence_store.py'
      - 'bench/tools/evidence_inventory.py'
      - 'bench/tools/regrade.py'
      - 'bench/tools/subscription_meters.py'
      - 'bench/schema/**'
      - 'bench/roster.json'
      - 'bench/rates.current.json'
      - 'bench/scoreboard.current.json'
      - 'bench/arms/**'
      - 'bench/harness/**'
      - 'tools/behavior_contract.py'
      - 'tools/behavior_contracts/**'
      - 'docs/python-migration/runtime-evidence/rollback.sh'
      - '.github/workflows/rust-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'bench/tools/rust_runtime.py'
      - 'bench/tools/test_rust_runtime.py'
      - 'bench/tools/check_manifest.py'
      - 'bench/tools/rates.py'
      - 'bench/tools/evidence_store.py'
      - 'bench/tools/evidence_inventory.py'
      - 'bench/tools/regrade.py'
      - 'bench/tools/subscription_meters.py'
      - 'bench/schema/**'
      - 'bench/roster.json'
      - 'bench/rates.current.json'
      - 'bench/scoreboard.current.json'
      - 'bench/arms/**'
      - 'bench/harness/**'
      - 'tools/behavior_contract.py'
      - 'tools/behavior_contracts/**'
      - 'docs/python-migration/runtime-evidence/rollback.sh'
      - '.github/workflows/rust-runtime.yml'

permissions:
  contents: read

concurrency:
  group: rust-runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-runtime:
    strategy:
      fail-fast: false
      matrix:
        # One runner per entry of rust_runtime.SUPPORTED_TARGETS.
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
    name: rust-runtime (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rustup when the image has none
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install pinned Rust toolchain and dependencies
        working-directory: rust/bench-tools
        run: |
          rustup show
          rustup default "$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.target }}"
          cargo fetch --locked
      - name: Check bench-tools formatting, lints and tests
        if: github.event_name != 'pull_request' || runner.os == 'Linux'
        working-directory: rust/bench-tools
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Check pinning, retention and rollback
        working-directory: bench/tools
        env:
          RUST_RUNTIME_REQUIRE_CARGO: '1'
        run: python3 -m unittest test_rust_runtime -v
      - name: Install bench-tools and check the retained executable
        env:
          BENCH_RUNTIME_STORE: ${{ runner.temp }}/rust-runtime-store
        run: |
          python3 bench/tools/rust_runtime.py install --crate rust/bench-tools --select
          python3 bench/tools/rust_runtime.py resolve bench-tools | tee "$RUNNER_TEMP/bench-tools.json"
          python3 bench/tools/rust_runtime.py exec bench-tools -- roster > "$RUNNER_TEMP/roster.tsv"
          test -s "$RUNNER_TEMP/roster.tsv"
          python3 - "$RUNNER_TEMP/bench-tools.json" > "$RUNNER_TEMP/bench-tools-map.json" <<'EOF'
          import json, sys
          executable = json.load(open(sys.argv[1]))["executable"]
          print(json.dumps({name: [executable, name] for name in ("diff-identity", "normalize-review", "check-manifest", "rates", "upstream", "ruling", "grading", "current-grading", "methodology", "claims", "calibration", "evaluator-audit")}))
          EOF
      - name: Smoke test bench-tools on macOS pull requests
        if: github.event_name == 'pull_request' && runner.os == 'macOS'
        env:
          BENCH_RUNTIME_STORE: ${{ runner.temp }}/rust-runtime-store
        run: python3 tools/behavior_contract.py --corpus tools/behavior_contracts/diff-identity.v1.json --implementations "$RUNNER_TEMP/bench-tools-map.json"
      - name: Run bench-tools corpora with the retained executable
        if: github.event_name != 'pull_request' || runner.os == 'Linux'
        env:
          BENCH_RUNTIME_STORE: ${{ runner.temp }}/rust-runtime-store
        run: |
          python3 tools/behavior_contract.py --verify-decision-history
          python3 tools/behavior_contract.py --corpus tools/behavior_contracts/roster.v1.json
          python3 tools/behavior_contract.py --corpus tools/behavior_contracts/rates.v1.json --implementations "$RUNNER_TEMP/bench-tools-map.json"
          python3 tools/behavior_contract.py --allow-known-defects --corpus tools/behavior_contracts/rates.v1.json --differential "$RUNNER_TEMP/bench-tools-map.json"
          for corpus in diff-identity normalize-review upstream ruling-record ruling-dossier current-grading methodology claims calibration evaluator-audit grading-validation; do
            python3 tools/behavior_contract.py --corpus "tools/behavior_contracts/$corpus.v1.json" --implementations "$RUNNER_TEMP/bench-tools-map.json"
          done
          python3 tools/behavior_contract.py --corpus tools/behavior_contracts/check-manifest.v1.json
          python3 - > "$RUNNER_TEMP/check-manifest-python.json" <<'EOF'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import behavior_contract
          print(json.dumps(behavior_contract.python_commands(
              behavior_contract.load_corpus(Path("tools/behavior_contracts/check-manifest.v1.json")))))
          EOF
          python3 tools/behavior_contract.py --allow-known-defects --corpus tools/behavior_contracts/check-manifest.v1.json --implementations "$RUNNER_TEMP/check-manifest-python.json" --differential "$RUNNER_TEMP/bench-tools-map.json"
          python3 tools/behavior_contract.py --corpus tools/behavior_contracts/grade-prepare.v1.json
          python3 tools/behavior_contract.py --corpus tools/behavior_contracts/grade-map.v1.json
          python3 tools/behavior_contract.py --corpus tools/behavior_contracts/normalize-thermo.v1.json
          python3 tools/behavior_contract.py --corpus tools/behavior_contracts/derive-packet.v1.json
          python3 tools/behavior_contract.py --corpus tools/behavior_contracts/build-packet.v1.json
          python3 tools/behavior_contract.py --corpus tools/behavior_contracts/export-explorer.v1.json
          python3 tools/behavior_contract.py --corpus tools/behavior_contracts/archive.v1.json
          python3 - "$RUNNER_TEMP/bench-tools.json" > "$RUNNER_TEMP/regrade-map.json" <<'EOF'
          import json, sys
          executable = json.load(open(sys.argv[1]))["executable"]
          print(json.dumps({"regrade-status": [executable, "regrade", "status", "--"],
                            "regrade-archive-attempt": [executable, "regrade", "archive-attempt"]}))
          EOF
          python3 tools/behavior_contract.py --corpus tools/behavior_contracts/regrade-reports.v1.json --implementations "$RUNNER_TEMP/regrade-map.json"
          python3 tools/behavior_contract.py --corpus tools/behavior_contracts/audit-log.v1.json
          python3 tools/behavior_contract.py --corpus tools/behavior_contracts/import-benchmark.v1.json
      - name: Run the evidence storage corpora with the retained executable and against the retained Python
        # Evidence storage refuses paths below a symlink, as Python does; macOS keeps its temporary directories below
        # the /var and /tmp links.
        if: runner.os == 'Linux'
        env:
          BENCH_RUNTIME_STORE: ${{ runner.temp }}/rust-runtime-store
        run: |
          python3 - "$RUNNER_TEMP/bench-tools.json" > "$RUNNER_TEMP/evidence-map.json" <<'EOF'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import behavior_contract
          executable = json.load(open(sys.argv[1]))["executable"]
          commands = behavior_contract.default_commands(
              behavior_contract.load_corpus(Path("tools/behavior_contracts/evidence-store.v1.json")))
          commands["evidence-store"] = [executable, "evidence"]
          print(json.dumps(commands))
          EOF
          python3 tools/behavior_contract.py --corpus tools/behavior_contracts/evidence-store.v1.json --implementations "$RUNNER_TEMP/evidence-map.json"
          python3 tools/behavior_contract.py --allow-known-defects --corpus tools/behavior_contracts/evidence-store.v1.json --differential "$RUNNER_TEMP/evidence-map.json"
          python3 - "$RUNNER_TEMP/bench-tools.json" > "$RUNNER_TEMP/inventory-map.json" <<'EOF'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import behavior_contract
          executable = json.load(open(sys.argv[1]))["executable"]
          commands = behavior_contract.default_commands(
              behavior_contract.load_corpus(Path("tools/behavior_contracts/evidence-inventory.v1.json")))
          commands["evidence-inventory"] = [executable, "evidence", "inventory"]
          print(json.dumps(commands))
          EOF
          python3 tools/behavior_contract.py --corpus tools/behavior_contracts/evidence-inventory.v1.json --implementations "$RUNNER_TEMP/inventory-map.json"
          python3 tools/behavior_contract.py --allow-known-defects --corpus tools/behavior_contracts/evidence-inventory.v1.json --differential "$RUNNER_TEMP/inventory-map.json"
      - name: Run the native artifacts corpus with the retained executable and against the retained Python
        if: runner.os == 'Linux'
        env:
          BENCH_RUNTIME_STORE: ${{ runner.temp }}/rust-runtime-store
        run: |
          python3 - "$RUNNER_TEMP" <<'EOF'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import behavior_contract
          corpus = behavior_contract.load_corpus(Path("tools/behavior_contracts/native-artifacts.v1.json"))
          Path(sys.argv[1], "native-rust-map.json").write_text(json.dumps(behavior_contract.default_commands(corpus)))
          Path(sys.argv[1], "native-python-map.json").write_text(json.dumps(behavior_contract.python_commands(corpus)))
          EOF
          python3 tools/behavior_contract.py --corpus tools/behavior_contracts/native-artifacts.v1.json --implementations "$RUNNER_TEMP/native-rust-map.json"
          python3 tools/behavior_contract.py --allow-known-defects --corpus tools/behavior_contracts/native-artifacts.v1.json --implementations "$RUNNER_TEMP/native-python-map.json" --differential "$RUNNER_TEMP/native-rust-map.json"
      - name: Install a second version and roll back
        if: github.event_name != 'pull_request' || runner.os == 'Linux'
        run: docs/python-migration/runtime-evidence/rollback.sh "$RUNNER_TEMP/rollback" "$(git rev-parse HEAD)"
