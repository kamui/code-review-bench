version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    exclude-paths:
      - bench/runs/**
      - docs/research/**
  - package-ecosystem: npm
    directories:
      - /bench/runs/**/*
      - /docs/research/**/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # Frozen benchmark evidence must retain its original dependency requirements.
    ignore:
      - dependency-name: '*'
        versions: ['>= 0']
