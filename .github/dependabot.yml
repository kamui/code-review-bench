version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    exclude-paths:
      - bench/runs/**
  - package-ecosystem: npm
    directories:
      - /bench/runs/**
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # Frozen benchmark evidence must retain its original dependency requirements.
    ignore:
      - dependency-name: '*'
