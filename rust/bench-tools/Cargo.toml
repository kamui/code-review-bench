[package]
name = "bench-tools"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
all = "deny"

[profile.release]
overflow-checks = true
