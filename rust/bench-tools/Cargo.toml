[package]
name = "bench-tools"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
regex = { version = "1.13.1", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
all = "deny"

[profile.release]
overflow-checks = true
