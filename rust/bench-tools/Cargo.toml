[package]
name = "bench-tools"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "=4.6.7", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
nix = { version = "=0.31.3", default-features = false, features = ["fs"] }
regex = { version = "1.13.1", default-features = false, features = ["std"] }
sha1_smol = { version = "=1.0.1", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
tar = { version = "=0.4.46", default-features = false }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2"] }

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
all = "deny"

[profile.release]
overflow-checks = true
