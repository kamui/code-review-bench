[package]
name = "usage-pilot"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "=0.4.38", default-features = false, features = ["std"] }
cpu-time = "=1.0.0"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = { version = "=1.0.128", features = ["arbitrary_precision"] }

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
all = "deny"

[profile.release]
overflow-checks = true

