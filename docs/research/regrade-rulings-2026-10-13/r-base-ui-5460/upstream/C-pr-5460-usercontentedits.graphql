query {
  repository(owner: "mui", name: "base-ui") {
    pullRequest(number: 5460) {
      number
      title
      createdAt
      mergedAt
      lastEditedAt
      isDraft
      body
      userContentEdits(first: 50) {
        totalCount
        nodes {
          createdAt
          editedAt
          editor { login }
          diff
        }
      }
    }
  }
}
