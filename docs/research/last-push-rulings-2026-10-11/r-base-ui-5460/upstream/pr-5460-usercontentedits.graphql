query {
  repository(owner: "mui", name: "base-ui") {
    pullRequest(number: 5460) {
      number
      title
      url
      state
      isDraft
      createdAt
      publishedAt
      lastEditedAt
      mergedAt
      updatedAt
      headRefOid
      baseRefOid
      author { login }
      editor { login }
      body
      userContentEdits(first: 50) {
        totalCount
        nodes {
          createdAt
          editedAt
          deletedAt
          editor { login }
          diff
        }
      }
    }
  }
}
